<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1DAL UI Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Pretendard 폰트 적용 */
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; }
    
    /* 글래스모피즘 유틸리티 */
    .glass-card {
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    /* 심사중 상태 애니메이션 (기존보다 더 세련되게) */
    .evaluating-glow {
      position: relative;
    }
    .evaluating-glow::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(90deg, transparent, rgba(245, 158, 11, 0.5), transparent);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: borderShimmer 2s infinite linear;
    }
    @keyframes borderShimmer {
      0% { background-position: 200% center; }
      100% { background-position: -200% center; }
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gray: { 950: '#030712', 900: '#111827', 800: '#1F2937' },
            success: '#10B981', // Emerald
            warning: '#F59E0B', // Amber
            danger: '#F43F5E',  // Rose
            brand: '#8B5CF6',   // Violet
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex justify-center overflow-x-hidden">

  <!-- 모바일 화면 사이즈 래퍼 -->
  <div class="w-full max-w-[400px] bg-gray-900 min-h-screen relative shadow-2xl border-x border-gray-800 flex flex-col">
    
    <!-- 1. Header (Sticky) -->
    <header class="sticky top-0 z-50 glass-card px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <h1 class="text-2xl font-black bg-gradient-to-r from-success to-blue-400 bg-clip-text text-transparent tracking-tighter">1DAL</h1>
        <span class="text-sm">🌙</span>
      </div>
      <div class="flex items-center gap-3">
        <!-- 뱃지 스타일 개선 -->
        <div class="flex items-center gap-1.5 px-2 py-1 bg-success/10 border border-success/20 rounded-full">
          <div class="w-1.5 h-1.5 rounded-full bg-success animate-pulse shadow-[0_0_8px_rgba(16,185,129,0.8)]"></div>
          <span class="text-xs font-mono font-bold text-success">22:19:23</span>
        </div>
        <div class="w-8 h-8 rounded-full bg-gray-700 border border-gray-600 flex items-center justify-center text-xs font-bold">기사</div>
      </div>
    </header>

    <main class="flex-1 p-3 flex flex-col gap-3">

      <!-- 2. Device Control Panel (정보 밀도 축소, 시각적 명확성 향상) -->
      <section class="glass-card rounded-xl p-3 flex justify-between items-center">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-gray-800 flex items-center justify-center font-black text-gray-400 border border-gray-700">1</div>
          <div class="flex flex-col">
            <span class="text-[10px] text-gray-500 font-bold mb-0.5">상태: 알 수 없는 화면</span>
            <div class="flex gap-2 text-xs font-mono">
              <span class="text-gray-400">수집:0</span>
              <span class="text-success font-bold">수락:0</span>
              <span class="text-danger">취소:0</span>
            </div>
          </div>
        </div>
        <!-- 토글 버튼 디자인 개선 -->
        <button class="bg-success/20 text-success border border-success/30 px-3 py-1.5 rounded-lg text-xs font-black tracking-wide hover:bg-success/30 transition-colors">
          AUTO
        </button>
      </section>

      <!-- 3. Filter Status (너무 길었던 정보 압축) -->
      <section class="glass-card rounded-xl p-3 flex items-center justify-between cursor-pointer hover:bg-gray-800/50 transition-colors active:scale-[0.98]">
        <div class="flex items-center gap-3">
          <span class="bg-brand/20 text-brand border border-brand/30 px-2 py-1 rounded text-[11px] font-bold">합짐 탐색중</span>
          <div class="flex flex-col">
            <div class="flex items-baseline gap-1">
              <span class="font-black text-success text-base">2.0만</span>
              <span class="text-[10px] text-gray-500">이상</span>
            </div>
            <span class="text-[11px] text-gray-400 mt-0.5">파주/서울(140동) | 1t,다,라</span>
          </div>
        </div>
        <div class="text-gray-600 text-lg">⚙️</div>
      </section>

      <!-- 4. Vehicle & Route Info (가독성 향상) -->
      <section class="flex flex-col gap-2 mt-2">
        <div class="flex items-center justify-between px-1">
          <div class="flex items-center gap-2">
            <span class="text-xs font-black bg-gray-800 px-2 py-0.5 rounded text-gray-300 border border-gray-700">1t</span>
            <span class="text-xs font-bold text-gray-400">적재 3건</span>
          </div>
          <div class="flex items-center gap-1.5">
            <div class="w-1.5 h-1.5 rounded-full bg-success"></div>
            <span class="text-xs font-bold text-success">정차 중</span>
          </div>
        </div>
      </section>

      <!-- 5. Map Placeholder (둥근 모서리, 지도 느낌) -->
      <section class="w-full h-[200px] bg-gray-800 rounded-xl border border-gray-700 relative overflow-hidden flex items-center justify-center mt-1">
        <div class="absolute inset-0 opacity-20" style="background-image: radial-gradient(#374151 1px, transparent 1px); background-size: 16px 16px;"></div>
        <span class="relative z-10 text-gray-500 font-bold text-sm">📍 카카오맵 영역</span>
        
        <!-- 가짜 경로 선 -->
        <svg class="absolute inset-0 w-full h-full" viewBox="0 0 100 100" preserveAspectRatio="none">
          <path d="M 20 80 Q 40 50, 50 40 T 80 20" stroke="#3B82F6" stroke-width="3" fill="none" class="opacity-70"></path>
        </svg>
      </section>

      <!-- 6. Total Summary -->
      <div class="flex items-end justify-between px-1 mt-2 mb-1">
        <div class="flex flex-col">
          <span class="text-[10px] text-gray-500">총 3개 경로 (2건 완료)</span>
          <span class="text-xs font-bold text-gray-300">거리 97.7km / 예상 95분</span>
        </div>
        <span class="text-xl font-black text-success">272,000 원</span>
      </div>

      <!-- 7. Filter Tabs (디자인 깔끔하게) -->
      <div class="flex gap-1 border-b border-gray-800 mt-2">
        <button class="flex-1 pb-2 text-xs font-bold text-success border-b-2 border-success">진행 중(1)</button>
        <button class="flex-1 pb-2 text-xs font-bold text-gray-500 hover:text-gray-400">완료됨(1)</button>
        <button class="flex-1 pb-2 text-xs font-bold text-gray-500 hover:text-gray-400">방출(1)</button>
      </div>

      <!-- 8. Order Cards -->
      <div class="flex flex-col gap-3 mt-3">
        
        <!-- 카드 A (심사중 / 데스밸리 상태 - 앰버 테두리 애니메이션 적용) -->
        <article class="bg-gray-800/80 rounded-xl p-3 border border-gray-700/50 evaluating-glow">
          <div class="flex justify-between items-start mb-2">
            <span class="text-xs font-mono text-gray-500">05:34</span>
            <span class="bg-warning/20 text-warning px-1.5 py-0.5 text-[10px] font-bold rounded">심사중 (7초)</span>
          </div>
          
          <!-- 주소 레이아웃 직관적으로 개선 -->
          <div class="flex flex-col gap-2 mb-3">
            <div class="flex items-center gap-2">
              <div class="w-5 h-5 rounded-full bg-blue-500/20 flex items-center justify-center border border-blue-500/30 text-[10px] font-black text-blue-400">1</div>
              <span class="text-sm font-bold">경안동</span>
              <span class="text-[10px] text-gray-500">(23:17)</span>
            </div>
            
            <div class="flex items-center pl-2">
              <div class="w-px h-4 bg-gray-600 ml-0.5"></div>
              <span class="text-[10px] text-gray-500 ml-3 bg-gray-800 px-1 rounded">-0분-</span>
            </div>

            <div class="flex items-center gap-2">
              <div class="w-5 h-5 rounded-full bg-danger/20 flex items-center justify-center border border-danger/30 text-[10px] font-black text-danger">2</div>
              <span class="text-sm font-bold">탄현면</span>
              <span class="text-[10px] text-gray-500">(23:17)</span>
            </div>
          </div>
          
          <div class="flex justify-between items-center pt-2 border-t border-gray-700/50">
            <div class="flex gap-2">
              <span class="text-xs text-gray-400">0.2km</span>
              <span class="text-xs text-gray-400">다마스</span>
            </div>
            <span class="text-lg font-black">112,000<span class="text-xs font-normal text-gray-400 ml-0.5">원</span></span>
          </div>
        </article>

        <!-- 카드 B (확정/진행중 상태 - 깔끔한 기본 스타일) -->
        <article class="bg-gray-800/50 rounded-xl p-3 border border-gray-700">
          <div class="flex justify-between items-start mb-2">
            <span class="text-xs font-mono text-gray-500">12:10</span>
            <span class="bg-success/20 text-success px-1.5 py-0.5 text-[10px] font-bold rounded">확정됨</span>
          </div>
          <div class="flex items-center gap-2 mb-1">
            <span class="text-sm font-bold text-gray-300">정자동</span>
            <span class="text-gray-600 text-xs">→</span>
            <span class="text-sm font-bold text-gray-300">역삼동</span>
          </div>
          <div class="flex justify-between items-center mt-2">
            <span class="text-xs text-gray-500">15km · 1t</span>
            <span class="text-base font-bold text-gray-300">65,000원</span>
          </div>
        </article>

      </div>

    </main>

    <!-- 9. Bottom Nav -->
    <nav class="sticky bottom-0 w-full glass-card border-t border-gray-800 flex mt-auto">
      <button class="flex-1 py-4 flex flex-col items-center justify-center gap-1 group">
        <span class="text-sm font-bold text-brand group-active:scale-95 transition-transform">실시간</span>
      </button>
      <button class="flex-1 py-4 flex flex-col items-center justify-center gap-1 group">
        <span class="text-sm font-bold text-gray-500 group-active:scale-95 transition-transform">정산</span>
      </button>
    </nav>
  </div>
</body>
</html>
