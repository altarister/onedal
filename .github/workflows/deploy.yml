name: Auto Deploy to AWS EC2

# 자동 배포 로봇 비활성화 (개발 중 비용 청구 방지)
# [알림] 다시 켜려면 아래 on: push 블록의 주석을 해제해주세요!
on:
  push:
    branches:
      - main
    paths:
      - "onedal-web/**" # 웹 폴더가 수정될 때만 배포 발동
      # 🎯 리허설 배차망(rehearsal.altari.com)도 이 서버가 서빙한다 (2026-08-23).
      #    안 넣으면 시뮬레이터만 고쳤을 때 **아무 일도 안 일어난다** — 조용히 안 올라가는 종류다.
      - "onedal-sim/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 커밋된 최신 코드 확인
        uses: actions/checkout@v4

      - name: 원격 서버(EC2) 연결 후 배포 스크립트 실행
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_H0ST || secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PEM_KEY }}
          script: |
            # 1. 원달 프로젝트 폴더로 이동 (폴더가 없으면 에러)
            cd ~/onedal/onedal/onedal-web || exit 1
            
            # 💾 [0/4] 코드를 갈아끼우기 **전에** DB 를 뜬다 (되돌릴 자리 확보)
            #    손으로 하면 잊는다. 배포마다 자동으로 남긴다 — 최근 5개만 보관.
            echo "💾 [0/4] 배포 전 DB 백업"
            if [ -f server/data.db ]; then
                # 🔴 **세 파일을 다 뜬다** (2026-08-23 실전에서 걸린 결함).
                #    SQLite 는 WAL 모드라 **최근 데이터가 data.db-wal 에 있다.** 본체만 뜨면
                #    그 시점 이후가 통째로 빠진 백업이 된다 — 그날 WAL 이 4MB 였다.
                #    되돌릴 때 이 셋을 **같이** 복원해야 그 순간으로 돌아간다.
                TS=$(date +%Y%m%d-%H%M%S)
                for f in data.db data.db-wal data.db-shm; do
                    [ -f "server/$f" ] && cp -a "server/$f" "server/$f.backup-$TS"
                done
                ls -1t server/data.db.backup-* | tail -n +6 | xargs -r rm -f
                ls -1t server/data.db-wal.backup-* 2>/dev/null | tail -n +6 | xargs -r rm -f
                ls -1t server/data.db-shm.backup-* 2>/dev/null | tail -n +6 | xargs -r rm -f
                echo "✅ 백업 완료 (최근 5벌 보관):"
                ls -la server/data.db*.backup-* | tail -6
            else
                echo "ℹ️ data.db 가 없습니다 — 첫 배포이거나 이미 지운 상태"
            fi

            echo "🚀 [1/4] 최신 코드 가져오기"
            git fetch --all
            git reset --hard origin/main
            git pull origin main
            
            echo "💾 [1.5/4] 메모리 기절 방지용 가상 메모리(Swap 2GB) 세팅"
            if [ ! -f /swapfile ]; then
                sudo fallocate -l 2G /swapfile
                sudo chmod 600 /swapfile
                sudo mkswap /swapfile
                sudo swapon /swapfile
                echo "✅ 가상 메모리 확보 완료!"
            fi
            
            echo "🔌 [1.6/4] 포트포워딩 복구 (재부팅 대비)"
            sudo iptables -t nat -A PREROUTING -p tcp --dport 80 -j REDIRECT --to-port 4000 || true
            
            echo "📦 [2/4] 핵심 패키지 재설치 (SQLite C++ 빌드 포함)"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"  # nvm 로드
            
            pnpm install
            pnpm rebuild better-sqlite3 esbuild
            
            echo "🔨 [3/4] 클라이언트 프론트엔드 빌드"
            # 프론트엔드 빌드 (정적 파일 생성)
            cd client-app && pnpm build && cd ..

            # 🎯 [3.5/4] 리허설 배차망(onedal-sim) 빌드 — rehearsal.altari.com 이 이걸 서빙한다.
            #    ⚠️ onedal-sim 은 **별도 워크스페이스**다 (onedal-web 에 안 들어 있다).
            #       그래서 pnpm install 을 따로 돌려야 한다.
            #    ⚠️ 실패해도 배포를 멈추지 않는다 — 리허설은 시험용이고, 이것 때문에
            #       관제 서버가 안 뜨면 본말전도다. 서버는 dist 가 없으면 건너뛴다.
            echo "🎯 [3.5/4] 리허설 배차망 빌드"
            ( cd ../onedal-sim && pnpm install && pnpm build && echo "✅ 리허설 배차망 준비 완료" ) \
                || echo "⚠️ 리허설 배차망 빌드 실패 — 건너뜁니다 (관제 서버는 정상 배포)"
            
            # 백엔드는 tsx로 실행되므로 빌드 생략
            
            echo "🔄 [4/4] PM2 서버 재시작 (무중단 갱신)"
            pm2 reload ecosystem.config.cjs --env production || {
                echo "⚠️ reload 실패 → 전체 재시작 (최초 배포 시)"
                pm2 delete all || true
                pm2 start ecosystem.config.cjs --env production
            }
            pm2 save
            
            echo "✅ 배포 완료!"
