name: Auto Deploy to AWS EC2

# 🔴 자동 배포는 **켜져 있다** — main 에 onedal-web/** · onedal-sim/** · 이 파일이 바뀐 push 가 오면 실서버(EC2)에 배포된다.
#    끄려면 아래 on: push 블록을 주석 처리한다.
# 🧪 먼저 GitHub 에서 검사(check)를 돌리고, 통과해야만 배포(deploy)한다 — 게이트를 건너뛴 push 가 실서버에 가지 않게.
# 🚦 배포 순서 · 되돌리기 · 운행 중 기다림은 onedal-web/scripts/deploy.sh 한 곳이다(검사: server/tests/rules/deployScript.test.ts).
on:
  push:
    branches:
      - main
    paths:
      - "onedal-web/**"
      # 🎯 리허설 배차망(rehearsal.altari.com)도 이 서버가 서빙한다 — 안 넣으면 시뮬레이터만 고친 push 는 조용히 안 올라간다
      - "onedal-sim/**"
      - ".github/workflows/deploy.yml"
  # 🖐️ 수동 실행 — 운행이 끝난 뒤 다시 올릴 때 · 급할 때 «운행 중이어도 올림»
  workflow_dispatch:
    inputs:
      force:
        description: "운행 중이어도 올림 (서버가 살아 있는데 급할 때만)"
        type: boolean
        default: false

# 🔁 배포는 한 번에 하나 — 돌던 배포는 끊지 않는다(빌드 · 다시 띄우기 도중에 끊으면 반쯤 배포). 뒤에 온 push 는 줄을 서고
#    맨 뒤 하나만 남는다. 돌던 배포도 갈아 끼울 때 origin/main 을 받으므로 기다리던 동안 온 새 커밋까지 올린다.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: onedal-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: onedal-web/pnpm-lock.yaml
      - name: 설치
        run: pnpm install --frozen-lockfile
      - name: 서버 타입 검사
        run: cd server && npx tsc --noEmit
      - name: 서버 · 규칙 검사 (jest)
        run: cd server && npx jest
      - name: 관제웹 타입 검사
        run: cd client-app && npx tsc -b
      - name: shared · 관제웹 검사
        run: pnpm test:web

  deploy:
    needs: check
    runs-on: ubuntu-latest
    # 🚦 운행 중이면 deploy.sh 가 1분마다 다시 묻고 최대 4시간 기다린다 — 그 위에 빌드 · 다시 띄우기 몫을 얹은 상한
    timeout-minutes: 280
    steps:
      - name: 원격 서버(EC2)에서 배포 스크립트 실행
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_H0ST || secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PEM_KEY }}
          command_timeout: 270m
          script: |
            cd ~/onedal/onedal/onedal-web || exit 1
            git fetch --all || exit 1
            # 🔴 새 판의 deploy.sh 를 임시 파일로 꺼내 돌린다 — 돌던 스크립트를 git 이 갈아 끼우면 bash 가 읽던 자리가 어긋난다
            git show origin/main:onedal-web/scripts/deploy.sh > /tmp/onedal-deploy.sh || exit 1
            DEPLOY_FORCE=${{ inputs.force == true }} bash /tmp/onedal-deploy.sh
